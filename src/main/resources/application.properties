spring.application.name=insurance-claims
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/claims
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true

claims.auth.claimant-password=${CLAIMS_CLAIMANT_PASSWORD:}
claims.auth.staff-password=${CLAIMS_STAFF_PASSWORD:}
claims.auth.manager-password=${CLAIMS_MANAGER_PASSWORD:}
